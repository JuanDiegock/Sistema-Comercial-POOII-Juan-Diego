
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Acceso al Sistema</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <header class="brand">
                <div class="logo">
                    <div class="logo-icon">IP</div>
                </div>
                <span class="brand-label">PORTAL CORPORATIVO</span>
                <h1>Acceso al Sistema</h1>
                <p class="subtitle">
                    Ingresa tus credenciales para continuar
                </p>
            </header>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarPassword"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >👁</button>
                    </div>
                </div>

                <div id="mensaje"
                     class="mensaje"
                     role="status"
                     aria-live="polite"></div>

                <div class="attempts-box">
                    <span id="intentosTexto">Intentos disponibles</span>
                    <div class="attempts-bars" aria-hidden="true">
                        <span class="attempt-bar"></span>
                        <span class="attempt-bar"></span>
                        <span class="attempt-bar"></span>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn-login">
                    <span>Iniciar sesión</span>
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <footer class="security">
                <span class="security-dot"></span>
                Acceso protegido
                <p>Sistema de autenticación</p>
            </footer>

        </section>

        <p class="footer-text">
            © 2026 · Sistema de Acceso
        </p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
