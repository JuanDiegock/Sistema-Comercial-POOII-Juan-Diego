<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>
    <link rel="stylesheet" href="css/estilos.css">

    <style>
        .users-page {
            width: min(1100px, 94%);
            margin: 40px auto;
            color: #f8fafc;
        }

        .users-header, .users-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .users-header p, .users-subtitle {
            color: #94a3b8;
            margin-top: 8px;
        }

        .users-card {
            background: #111827;
            border: 1px solid #263247;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .users-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .users-form input,
        .users-form select,
        .users-search {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0b1220;
            color: #f8fafc;
            box-sizing: border-box;
        }

        .users-form label {
            display: block;
            margin-bottom: 7px;
        }

        .users-field {
            min-width: 0;
        }

        .users-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            grid-column: 1 / -1;
        }

        .users-btn {
            padding: 11px 15px;
            border: 0;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .users-btn.secondary {
            background: #334155;
        }

        .users-btn.danger {
            background: #991b1b;
        }

        .users-table-wrap {
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        .users-table th,
        .users-table td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #263247;
        }

        .users-table th {
            color: #a5b4fc;
            font-size: 12px;
        }

        .users-table td {
            font-size: 13px;
        }

        .users-message {
            min-height: 20px;
            margin-bottom: 15px;
            color: #a5b4fc;
        }

        .users-back {
            color: #a5b4fc;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .users-form {
                grid-template-columns: 1fr;
            }

            .users-buttons {
                grid-column: auto;
            }

            .users-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<main class="users-page">

    <header class="users-header">
        <div>
            <a class="users-back" href="panel.html">
                ← Volver al panel
            </a>

            <h1 style="text-align:left; margin-top:18px">
                Gestión de usuarios
            </h1>

            <p>Administra los usuarios y sus roles.</p>
        </div>

        <button
            class="users-btn secondary"
            id="cerrarSesion"
            type="button">
            Cerrar sesión
        </button>
    </header>

    <section class="users-card">

        <h2 id="formTitulo">Registrar usuario</h2>

        <p class="users-subtitle">
            Completa los datos del usuario.
        </p>

        <form
            id="usuarioForm"
            class="users-form"
            style="margin-top:20px">

            <input type="hidden" id="usuarioId">

            <div class="users-field">
                <label for="nombre">Nombre completo</label>
                <input
                    id="nombre"
                    required
                    maxlength="100"
                    placeholder="Ej. Juan Pérez">
            </div>

            <div class="users-field">
                <label for="nombreUsuario">Nombre de usuario</label>
                <input
                    id="nombreUsuario"
                    required
                    maxlength="40"
                    autocomplete="off"
                    placeholder="Ej. jperez">
            </div>

            <div class="users-field">
                <label for="correo">Correo electrónico</label>
                <input
                    id="correo"
                    type="email"
                    required
                    maxlength="120"
                    placeholder="usuario@empresa.com">
            </div>

            <div class="users-field">
                <label for="password">Contraseña</label>
                <input
                    id="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres">
            </div>

            <div class="users-field">
                <label for="rol">Rol</label>
                <select id="rol" required>
                    <option value="Administrador">Administrador</option>
                    <option value="Empleado">Empleado</option>
                    <option value="Supervisor">Supervisor</option>
                </select>
            </div>

            <div class="users-buttons">
                <button
                    class="users-btn"
                    type="submit"
                    id="guardarBtn">
                    Registrar usuario
                </button>

                <button
                    class="users-btn secondary"
                    type="button"
                    id="cancelarBtn">
                    Limpiar
                </button>
            </div>

        </form>
    </section>

    <section class="users-card">

        <div class="users-actions">
            <div>
                <h2>Usuarios registrados</h2>
                <p class="users-subtitle">
                    Datos locales de demostración de este navegador.
                </p>
            </div>

            <input
                class="users-search"
                id="buscar"
                placeholder="Buscar usuario..."
                style="max-width:280px">
        </div>

        <p
            class="users-message"
            id="mensaje"
            role="status"
            aria-live="polite">
        </p>

        <div class="users-table-wrap">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>

    </section>

</main>

<script>
const CLAVE_USUARIOS = "sistema_comercial_usuarios_demo";

const form = document.getElementById("usuarioForm");
const tabla = document.getElementById("tablaUsuarios");
const mensaje = document.getElementById("mensaje");
const buscar = document.getElementById("buscar");
const password = document.getElementById("password");
const usuarioId = document.getElementById("usuarioId");
const guardarBtn = document.getElementById("guardarBtn");
const formTitulo = document.getElementById("formTitulo");

let usuarios = [];

// Mostrar mensajes en pantalla
function mostrarMensaje(texto) {
    mensaje.textContent = texto;
}

// Guardar los usuarios en el navegador
function guardarDatos() {
    try {
        localStorage.setItem(
            CLAVE_USUARIOS,
            JSON.stringify(usuarios)
        );

        return true;

    } catch (error) {
        mostrarMensaje(
            "No se pudieron guardar los datos en este navegador."
        );

        return false;
    }
}

// Cargar los usuarios guardados
function cargarDatos() {
    try {
        const datos = localStorage.getItem(CLAVE_USUARIOS);

        usuarios = datos ? JSON.parse(datos) : [];

        if (!Array.isArray(usuarios)) {
            usuarios = [];
        }

    } catch (error) {
        usuarios = [];

        mostrarMensaje(
            "No se pudieron leer los datos guardados."
        );
    }

    renderizarUsuarios(buscar.value);
}

// Limpiar el formulario
function limpiarFormulario() {
    form.reset();

    usuarioId.value = "";

    formTitulo.textContent = "Registrar usuario";

    guardarBtn.textContent = "Registrar usuario";

    password.required = true;
    password.minLength = 8;
    password.placeholder = "Mínimo 8 caracteres";
}

// Mostrar la lista de usuarios
function renderizarUsuarios(filtro = "") {
    tabla.replaceChildren();

    const texto = filtro.trim().toLowerCase();

    const coincidencias = usuarios.filter(u =>
        `${u.nombre} ${u.usuario} ${u.correo} ${u.rol}`
            .toLowerCase()
            .includes(texto)
    );

    if (coincidencias.length === 0) {
        const fila = document.createElement("tr");
        const celda = document.createElement("td");

        celda.colSpan = 6;

        celda.textContent = usuarios.length
            ? "No se encontraron usuarios."
            : "No hay usuarios registrados.";

        fila.appendChild(celda);
        tabla.appendChild(fila);

        return;
    }

    coincidencias.forEach(u => {
        const fila = document.createElement("tr");

        [u.id, u.nombre, u.usuario, u.correo, u.rol]
            .forEach(valor => {
                const celda = document.createElement("td");

                celda.textContent = valor ?? "";

                fila.appendChild(celda);
            });

        const acciones = document.createElement("td");

        // Botón editar
        const editar = document.createElement("button");

        editar.type = "button";
        editar.className = "users-btn secondary";
        editar.textContent = "Editar";

        editar.addEventListener("click", () => {
            editarUsuario(u.id);
        });

        // Botón eliminar
        const eliminar = document.createElement("button");

        eliminar.type = "button";
        eliminar.className = "users-btn danger";
        eliminar.textContent = "Eliminar";
        eliminar.style.marginLeft = "8px";

        eliminar.addEventListener("click", () => {
            eliminarUsuario(u.id);
        });

        acciones.append(editar, eliminar);
        fila.appendChild(acciones);
        tabla.appendChild(fila);
    });
}

// Editar un usuario existente
function editarUsuario(id) {
    const u = usuarios.find(item => item.id === id);

    if (!u) return;

    usuarioId.value = u.id;

    document.getElementById("nombre").value = u.nombre;
    document.getElementById("nombreUsuario").value = u.usuario;
    document.getElementById("correo").value = u.correo;
    document.getElementById("rol").value = u.rol;

    password.value = "";
    password.required = false;
    password.minLength = 0;
    password.placeholder =
        "Déjala vacía para conservar la contraseña";

    formTitulo.textContent = "Editar usuario";
    guardarBtn.textContent = "Guardar cambios";

    mostrarMensaje(
        "Modifica los datos y pulsa Guardar cambios."
    );

    form.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

// Eliminar un usuario
function eliminarUsuario(id) {
    if (!confirm("¿Seguro que deseas eliminar este usuario?")) {
        return;
    }

    const anteriores = usuarios;

    usuarios = usuarios.filter(u => u.id !== id);

    if (!guardarDatos()) {
        usuarios = anteriores;
        return;
    }

    renderizarUsuarios(buscar.value);

    mostrarMensaje("Usuario eliminado correctamente.");
}

// Registrar o actualizar un usuario
form.addEventListener("submit", event => {
    event.preventDefault();

    const id = usuarioId.value;

    const nombre =
        document.getElementById("nombre").value.trim();

    const usuario =
        document.getElementById("nombreUsuario").value.trim();

    const correo =
        document.getElementById("correo").value.trim();

    const rol = document.getElementById("rol").value;

    const passwordIngresada = password.value;

    // Validar la contraseña al registrar
    if (!id && passwordIngresada.length < 8) {
        mostrarMensaje(
            "La contraseña debe tener al menos 8 caracteres."
        );

        return;
    }

    // Si se modifica la contraseña, validar longitud
    if (
        id &&
        passwordIngresada &&
        passwordIngresada.length < 8
    ) {
        mostrarMensaje(
            "Si cambias la contraseña, debe tener al menos 8 caracteres."
        );

        return;
    }

    // Evitar usuarios o correos duplicados
    const duplicado = usuarios.some(u =>
        u.id !== id &&
        (
            String(u.usuario).toLowerCase() === usuario.toLowerCase() ||
            String(u.correo).toLowerCase() === correo.toLowerCase()
        )
    );

    if (duplicado) {
        mostrarMensaje(
            "Ese nombre de usuario o correo ya está registrado."
        );

        return;
    }

    const anteriores = usuarios.map(u => ({ ...u }));

    if (id) {
        // Actualizar usuario existente
        usuarios = usuarios.map(u => {
            if (u.id !== id) {
                return u;
            }

            return {
                ...u,
                nombre,
                usuario,
                correo,
                rol,
                password: passwordIngresada
                    ? passwordIngresada
                    : u.password
            };
        });

    } else {
        // Registrar usuario nuevo
        usuarios.push({
            id: String(Date.now()),
            nombre,
            usuario,
            correo,
            rol,
            password: passwordIngresada
        });
    }

    // Guardar cambios
    if (!guardarDatos()) {
        usuarios = anteriores;
        return;
    }

    limpiarFormulario();

    renderizarUsuarios(buscar.value);

    mostrarMensaje(
        id
            ? "Usuario actualizado correctamente."
            : "Usuario registrado correctamente. Ya puedes probar el inicio de sesión en este navegador."
    );
});

// Botón limpiar
document.getElementById("cancelarBtn")
    .addEventListener("click", () => {
        limpiarFormulario();
        mostrarMensaje("");
    });

// Cerrar sesión
document.getElementById("cerrarSesion")
    .addEventListener("click", () => {
        sessionStorage.removeItem("sesion_usuario");
        window.location.href = "index.html";
    });

// Buscar usuarios
buscar.addEventListener("input", () => {
    renderizarUsuarios(buscar.value);
});

// Iniciar la página
cargarDatos();
</script>

</body>
</html>
